stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"

lint-frontend:
  stage: lint
  image: node:20
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/sion_test_db"
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - cd backend
    - mvn -B test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -f Dockerfile.frontend -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Despliegue a EC2 (manual): requiere las variables de proyecto
# SSH_PRIVATE_KEY (contenido de Jose25.pem) y EC2_HOST (IP publica de la instancia)
deploy-aws:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - >
      ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 ubuntu@$EC2_HOST
      "cd /opt/sion
      && git pull
      && docker-compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
