spring:
  application:
    name: sion-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/sion_db}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:3000}

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForSionUnac2026MustBe32Chars}
    expiration: 604800000
  upload:
    dir: ${UPLOAD_DIR:./uploads}

# demo-mode devuelve el codigo de recuperacion en la respuesta (solo demo local;
# se activa explicitamente via variable de entorno DEMO_MODE en docker-compose.yml)
sion:
  demo-mode: ${DEMO_MODE:false}
